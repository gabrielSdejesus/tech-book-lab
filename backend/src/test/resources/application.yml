server:
  port: 0

spring:
  application:
    name: tech-book-lab
  datasource:
    url: jdbc:h2:mem:tbl_catalog;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration

lab:
  postgres:
    url: jdbc:postgresql://localhost:5432/tbl_lab
    username: postgres
    password: postgrespassword
  neo4j:
    uri: bolt://localhost:7687
    username: neo4j
    password: tblpassword
  ai:
    provider: gemini
    gemini:
      api-key: ""
      model: gemini-3.8-flash
    ollama:
      base-url: http://localhost:11434
      model: qwen2.5-coder:1.5b
