server:
  port: 8080

spring:
  application:
    name: tech-book-lab
  datasource:
    url: ${CATALOG_DB_URL:jdbc:sqlite:data/tbl_catalog.db}
    driver-class-name: ${CATALOG_DB_DRIVER:org.sqlite.JDBC}
    hikari:
      pool-name: ${CATALOG_DB_POOL_NAME:TblCatalogHikariPool}
      maximum-pool-size: ${CATALOG_DB_MAX_POOL_SIZE:10}
      minimum-idle: ${CATALOG_DB_MIN_IDLE:2}
      connection-timeout: ${CATALOG_DB_CONNECTION_TIMEOUT:10000}
      idle-timeout: ${CATALOG_DB_IDLE_TIMEOUT:60000}
      max-lifetime: ${CATALOG_DB_MAX_LIFETIME:1800000}
      data-source-properties:
        journal_mode: ${CATALOG_DB_JOURNAL_MODE:WAL}
        synchronous: ${CATALOG_DB_SYNCHRONOUS:NORMAL}
        busy_timeout: ${CATALOG_DB_BUSY_TIMEOUT:5000}
        foreign_keys: ${CATALOG_DB_FOREIGN_KEYS:true}
  flyway:
    enabled: true
    locations: classpath:db/migration

lab:
  postgres:
    url: jdbc:postgresql://localhost:5432/tbl_lab
    username: postgres
    password: postgrespassword
  neo4j:
    uri: bolt://localhost:7687
    username: neo4j
    password: tblpassword
  provisioning:
    inactivity-timeout-minutes: ${LAB_PROVISIONING_INACTIVITY_TIMEOUT_MINUTES:15}
    heartbeat-interval-seconds: ${LAB_PROVISIONING_HEARTBEAT_INTERVAL_SECONDS:30}
  ai:
    provider: ${AI_PROVIDER:gemini} # gemini, ollama, or heuristic
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.8-flash}
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:qwen2.5-coder:1.5b}
  engines:
    configs:
      postgres:
        service-name: postgres
        container-name: tbl-lab-postgres
        default-port: 5432
        image: postgres:16-alpine
        ports:
          - "0:5432"
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: tbl_lab
      neo4j:
        service-name: neo4j
        container-name: tbl-lab-neo4j
        default-port: 7687
        image: neo4j:5-community
        ports:
          - "0:7687"
          - "0:7474"
        env:
          NEO4J_AUTH: neo4j/tblpassword
