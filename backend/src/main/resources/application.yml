server:
  port: 8080

spring:
  application:
    name: tech-book-lab
  datasource:
    url: ${CATALOG_DB_URL:jdbc:sqlite:data/tbl_catalog.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      pool-name: TblCatalogHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      idle-timeout: 60000
      max-lifetime: 1800000
      data-source-properties:
        journal_mode: WAL
        synchronous: NORMAL
        busy_timeout: 5000
        foreign_keys: "true"
  flyway:
    enabled: true
    locations: classpath:db/migration

lab:
  postgres:
    url: jdbc:postgresql://localhost:5432/tbl_lab
    username: postgres
    password: postgrespassword
  neo4j:
    uri: bolt://localhost:7687
    username: neo4j
    password: tblpassword
  ai:
    provider: ${AI_PROVIDER:gemini} # gemini, ollama, or heuristic
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.8-flash}
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:qwen2.5-coder:1.5b}
