<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf7ee"/>
      <stop offset="100%" stop-color="#f2ede0"/>
    </linearGradient>
    <filter id="paper-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="560" fill="url(#bg)"/>
  
  <!-- Spine Shadow Left -->
  <rect width="14" height="560" fill="#e2dac8" opacity="0.6"/>
  <line x1="14" y1="0" x2="14" y2="560" stroke="#78716c" stroke-width="1.2" opacity="0.4"/>

  <!-- Outer Double Border Frame -->
  <rect x="22" y="16" width="356" height="528" fill="none" stroke="#292524" stroke-width="2.5"/>
  <rect x="26" y="20" width="348" height="520" fill="none" stroke="#78716c" stroke-width="0.8"/>

  <!-- Top Category Banner -->
  <rect x="30" y="28" width="340" height="42" fill="#059669"/>
  <text x="200" y="54" fill="#ffffff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="900" letter-spacing="3" text-anchor="middle">
    SISTEMAS DISTRIBUÍDOS &amp; DADOS
  </text>

  <!-- Series & Lab Label -->
  <text x="200" y="96" fill="#78716c" font-family="'Courier New', monospace" font-size="10" font-weight="700" letter-spacing="2" text-anchor="middle">
    TECH BOOK LAB &bull; EDIÇÃO PRÁTICA
  </text>

  <!-- Book Main Title -->
  <text x="200" y="132" fill="#1c1917" font-family="Georgia, Cambria, serif" font-size="23" font-weight="900" text-anchor="middle" letter-spacing="-0.5">
    Designing
  </text>
  <text x="200" y="160" fill="#059669" font-family="Georgia, Cambria, serif" font-size="23" font-weight="900" text-anchor="middle" letter-spacing="-0.5">
    Data-Intensive
  </text>
  <text x="200" y="188" fill="#1c1917" font-family="Georgia, Cambria, serif" font-size="22" font-weight="900" text-anchor="middle" letter-spacing="-0.5">
    Applications
  </text>

  <!-- Subtitle -->
  <line x1="120" y1="202" x2="280" y2="202" stroke="#059669" stroke-width="1.5"/>
  <text x="200" y="218" fill="#44403c" font-family="Georgia, Cambria, serif" font-size="10.5" font-style="italic" text-anchor="middle">
    As Grandes Ideias por Trás de Sistemas Confiáveis,
  </text>
  <text x="200" y="232" fill="#44403c" font-family="Georgia, Cambria, serif" font-size="10.5" font-style="italic" text-anchor="middle">
    Escaláveis e Fáceis de Manter
  </text>

  <!-- Woodcut Engraving Style Center Frame -->
  <rect x="48" y="246" width="304" height="210" fill="#fdfbf7" stroke="#292524" stroke-width="1.5"/>
  <rect x="52" y="250" width="296" height="202" fill="none" stroke="#a8a29e" stroke-width="0.75" stroke-dasharray="2,2"/>

  <!-- Engraved Animal / Boar Silhouette & Hatching Elements -->
  <g transform="translate(110, 275) scale(0.65)" fill="#292524">
    <!-- Stylized Woodcut Wild Boar -->
    <path d="M 40 120 C 30 110 20 85 30 65 C 38 48 55 42 75 40 C 95 38 120 45 145 42 C 165 40 190 30 215 35 C 235 39 250 55 255 75 C 260 95 245 125 240 145 C 235 165 210 175 190 170 C 180 167 175 180 170 200 L 155 200 L 158 175 C 145 178 135 180 120 180 L 125 205 L 110 205 L 115 175 C 95 175 80 165 70 155 L 60 195 L 45 195 L 52 145 C 45 138 42 130 40 120 Z"/>
    <!-- Tusks & Bristles details -->
    <path d="M 235 95 C 248 98 260 92 265 82 C 260 88 250 90 238 90 Z" fill="#fafaf9"/>
    <path d="M 120 30 L 125 42 M 135 28 L 138 40 M 150 25 L 152 40 M 165 25 L 166 38 M 180 27 L 180 40 M 195 29 L 193 42" stroke="#292524" stroke-width="2.5"/>
    <!-- Engraving Hatch Lines inside Boar -->
    <line x1="80" y1="70" x2="110" y2="70" stroke="#fafaf9" stroke-width="1.5" opacity="0.6"/>
    <line x1="75" y1="80" x2="120" y2="80" stroke="#fafaf9" stroke-width="1.5" opacity="0.6"/>
    <line x1="70" y1="90" x2="135" y2="90" stroke="#fafaf9" stroke-width="1.5" opacity="0.6"/>
    <line x1="70" y1="100" x2="140" y2="100" stroke="#fafaf9" stroke-width="1.5" opacity="0.6"/>
    <line x1="75" y1="110" x2="150" y2="110" stroke="#fafaf9" stroke-width="1.5" opacity="0.6"/>
    <line x1="85" y1="120" x2="160" y2="120" stroke="#fafaf9" stroke-width="1.5" opacity="0.6"/>
    <line x1="95" y1="130" x2="170" y2="130" stroke="#fafaf9" stroke-width="1.5" opacity="0.6"/>
    <!-- Technical Data Node Graphic Overlay behind animal -->
    <circle cx="20" cy="30" r="4" fill="#059669"/>
    <circle cx="250" cy="20" r="4" fill="#059669"/>
    <circle cx="25" cy="170" r="4" fill="#059669"/>
    <line x1="20" y1="30" x2="60" y2="50" stroke="#059669" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="250" y1="20" x2="220" y2="45" stroke="#059669" stroke-width="1" stroke-dasharray="3,3"/>
  </g>

  <!-- Engraving Caption -->
  <text x="200" y="445" fill="#78716c" font-family="'Courier New', monospace" font-size="9" text-anchor="middle" letter-spacing="1">
    SUS SCROFA &bull; JAVALI SELVAGEM ASIÁTICO
  </text>

  <!-- Author Line Bottom -->
  <rect x="30" y="470" width="340" height="42" fill="#f5eedb" stroke="#78716c" stroke-width="0.8"/>
  <text x="200" y="496" fill="#1c1917" font-family="Georgia, Cambria, serif" font-size="15" font-weight="700" letter-spacing="1" text-anchor="middle">
    Martin Kleppmann
  </text>

  <!-- Editorial Colophon / Stamp -->
  <text x="200" y="528" fill="#78716c" font-family="'Courier New', monospace" font-size="8.5" font-weight="600" letter-spacing="2" text-anchor="middle">
    TECH BOOK LAB CLASSICS &bull; 2026
  </text>
</svg>
